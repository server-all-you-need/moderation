server:
  addr: ":8080"
  read_timeout_ms: 5000
  read_header_timeout_ms: 2000
  write_timeout_ms: 10000
  idle_timeout_ms: 60000

database:
  url: "postgres://moderation:placeholder@localhost:5432/moderation?sslmode=disable"

redis:
  addr: "localhost:6379"
  password: ""
  db: 0

zapConfig:
  level: "debug"
  encoding: "json"

kafka:
  brokers:
    - "localhost:9092"
  version: "2.8.1"
  consumer_group_id: "moderation-worker-dev"
  producer:
    required_acks: "wait_for_all"
    timeout_ms: 5000
    return_successes: true
    return_errors: true
    max_message_bytes: 1048576
  consumer:
    session_timeout_ms: 30000
    heartbeat_interval_ms: 10000
    offsets:
      auto_commit_enable: false
      auto_commit_interval_ms: 5000
      initial: "earliest"
  enable_sasl: false
  sasl_user: ""
  sasl_password: ""
  sasl_mechanism: "PLAIN"
  enable_tls: false
  tls_ca_file: ""
  tls_cert_file: ""
  tls_key_file: ""
  tls_insecure_skip_verify: false

aliyun_audit:
  access_key_id: "placeholder-access-key-id"
  access_key_secret: "placeholder-access-key-secret"
  region_id: "cn-shanghai"
  endpoint: "green-cip.cn-shanghai.aliyuncs.com"
  timeout_ms: 5000

api_clients:
  - id: "dev-client"
    name: "Development Client"
    token_sha256: "replace-with-sha256-token-digest"
    scopes:
      - "moderation:check"
      - "moderation:submit"
      - "moderation:read"
    webhook_endpoints:
      - url: "https://hooks.example.com/moderation"
        secret_id: "dev-webhook-secret"

admin:
  token_sha256: "replace-with-sha256-admin-token-digest"

webhook_secrets:
  - caller_id: "dev-client"
    secret_id: "dev-webhook-secret"
    value: "replace-with-runtime-webhook-secret"
